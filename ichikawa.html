    }

    #loading h2 { font-size: 18px; font-weight: 700; color: #222; }
    #progress-bar-wrap { width: 300px; background: #e8eef8; border-radius: 99px; height: 7px; overflow: hidden; }
    #progress-bar { height: 100%; background: linear-gradient(90deg,#4a90d9,#76baff); border-radius: 99px; width: 0%; transition: width 0.2s; }
    #progress-text { font-size: 12px; color: #999; }

    /* ── Control Panel ── */
    #panel {
      position: fixed; top: 12px; right: 12px; z-index: 1000;
      background: #fff; border-radius: 16px; padding: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.13); width: 248px;
    }
    #panel-title {
      font-size: 15px; font-weight: 800; color: #1a1a1a;
      margin-bottom: 13px; padding-bottom: 11px; border-bottom: 1.5px solid #f2f2f2;
      display: flex; align-items: center; gap: 6px;
    }

    /* Search */
    #search-wrap { position: relative; margin-bottom: 12px; }
    #search-input {
      width: 100%; padding: 8px 30px 8px 32px;
      border: 1.5px solid #e4e4e4; border-radius: 9px;
      font-size: 13px; color: #333; outline: none; transition: border-color 0.2s;
      font-family: inherit;
    }
    #search-input:focus { border-color: #4a90d9; }
    #search-input::placeholder { color: #bbb; }
    .search-icon {
      position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
      font-size: 14px; color: #bbb; pointer-events: none;
    }
    #search-clear {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      font-size: 13px; color: #ccc; cursor: pointer; background: none; border: none;
      display: none; line-height: 1; padding: 2px;
    }
    #search-clear:hover { color: #888; }

    /* Type filter pills */
    .section-label { font-size: 10px; color: #aaa; font-weight: 700; letter-spacing: 0.08em; margin-bottom: 7px; }
    #filter-section { margin-bottom: 12px; }
    #filter-pills { display: flex; flex-wrap: wrap; gap: 5px; }
    .filter-pill {
      padding: 4px 9px; border-radius: 99px; font-size: 11px; font-weight: 700;
      border: 1.5px solid; cursor: pointer; transition: all 0.15s;
      user-select: none;
    }
    .filter-pill.on { color: #fff; }
    .filter-pill.off { background: #f6f6f6 !important; color: #aaa !important; border-color: #e0e0e0 !important; }

    /* View toggles */
    #view-section { margin-bottom: 10px; }
    .view-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 0; cursor: pointer; border-radius: 8px;
    }
    .view-row:hover { background: #f9f9f9; padding-left: 4px; padding-right: 4px; margin: 0 -4px; }
    .view-row-label { font-size: 13px; color: #444; }
    .sw {
      width: 36px; height: 20px; background: #ddd; border-radius: 99px;
      position: relative; transition: background 0.2s; flex-shrink: 0;
    }
    .sw.on { background: #4a90d9; }
    .sw::after {
      content: ''; position: absolute; top: 3px; left: 3px;
      width: 14px; height: 14px; background: #fff; border-radius: 50%;
      transition: left 0.2s; box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
    .sw.on::after { left: 19px; }

    /* Count */
    #result-count {
      text-align: center; font-size: 11px; color: #bbb;
      padding-top: 10px; border-top: 1.5px solid #f2f2f2; margin-top: 2px;
    }
    #result-count b { color: #4a90d9; font-size: 15px; }

    /* ── Stats Panel ── */
    #stats {
      position: fixed; bottom: 12px; left: 12px; z-index: 1000;
      background: #fff; border-radius: 16px; padding: 14px 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.13); min-width: 210px;

    .st-n { font-size: 11px; font-weight: 700; color: #333; text-align: right; min-width: 28px; }
    .st-cap { font-size: 10px; color: #aaa; text-align: right; min-width: 52px; }
    #stats-total {
      margin-top: 9px; padding-top: 9px; border-top: 1.5px solid #f2f2f2;
      display: flex; align-items: baseline; justify-content: space-between;
    }

    #stats-total-unit { font-size: 11px; color: #aaa; margin-left: 2px; }

      background: #fff; border-radius: 10px; padding: 8px 12px;

    .pp-cap-num { font-size: 24px; font-weight: 800; color: #4a90d9; line-height: 1; }
    .pp-cap-unit { font-size: 11px; color: #888; margin-left: 2px; }
    .pp-bar-wrap { margin-top: 7px; background: #eff4fb; border-radius: 4px; height: 5px; overflow: hidden; }

</head>

const TYPE_COLOR = {
  "公立":       "#3388ff",
  "私立":       "#2da44e",
  "認定こども園":"#f08030",
  "小規模":     "#e67e22",
  "事業所内":   "#9b59b6",
};
const TYPE_BG = {
  "公立":       "#e8f0fe",
  "私立":       "#e6f4ea",
  "認定こども園":"#fff3e0",
  "小規模":     "#fef3e2",
  "事業所内":   "#f5eef8",
};
const TYPE_ORDER = ["公立","私立","認定こども園","小規模","事業所内"];

const CACHE_KEY = 'ichikawa_geocache_v2';
const MAX_CAP = 220;

const map = L.map('map').setView([35.72, 139.93], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19
}).addTo(map);

let pinLayer = L.layerGroup().addTo(map);
let heatLayer = null;
let pinsVisible = true;
let heatVisible = false;

// marker registry: [{marker, facility}]
const markerList = [];
const activeTypes = new Set(TYPE_ORDER);
let searchQuery = '';

function popupHTML(f) {
  const color = TYPE_COLOR[f.t] || '#888';
  const bg    = TYPE_BG[f.t]    || '#eee';
  const addr  = f.a.replace('千葉県市川市','市川市 ');
  const pct   = Math.round(f.c / MAX_CAP * 100);
  return `
    <div class="pp-name">${f.n}</div>
    <span class="pp-badge" style="background:${bg};color:${color};">${f.t}</span>
    <div class="pp-addr">📍 ${addr}</div>
    <div class="pp-cap-label">定員</div>
    <span class="pp-cap-num">${f.c}</span><span class="pp-cap-unit">名</span>
    <div class="pp-bar-wrap">
      <div class="pp-bar" style="width:${pct}%;background:${color};"></div>
    </div>
  `;
}

async function geocodeAddress(addr) {
  const url = `https://msearch.gsi.go.jp/address-search/AddressSearch?q=${encodeURIComponent(addr)}`;
  try {
    const res = await fetch(url);
    const data = await res.json();
    if (data && data.length > 0) {
      const [lng, lat] = data[0].geometry.coordinates;
      return { lat, lng };
    }
  } catch(e) {}
  return null;
}

function capRadius(c) {
  return Math.max(5, Math.min(22, 5 + (c / MAX_CAP) * 17));
}

const coordCount = {};
function jitter(lat, lng) {
  const key = `${lat.toFixed(5)},${lng.toFixed(5)}`;
  const n = coordCount[key] || 0;
  coordCount[key] = n + 1;
  if (n === 0) return { lat, lng };
  const angle = n * 137.508 * Math.PI / 180;
  const r = 0.00012 * Math.ceil(n / 8);
  return { lat: lat + r * Math.sin(angle), lng: lng + r * Math.cos(angle) };
}

function applyFilters() {
  let shown = 0;
  markerList.forEach(({ marker, facility }) => {
    const matchType = activeTypes.has(facility.t);
    const matchSearch = !searchQuery || facility.n.includes(searchQuery);
    if (matchType && matchSearch) {
      if (!pinLayer.hasLayer(marker)) pinLayer.addLayer(marker);
      shown++;
    } else {
      if (pinLayer.hasLayer(marker)) pinLayer.removeLayer(marker);
    }
  });
  document.getElementById('count-num').textContent = shown;
}

async function init() {
  const cache = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
  const total = FACILITIES.length;
  const heatData = [];
  let totalCap = 0;
  const typeCounts = {}, typeCaps = {};
  TYPE_ORDER.forEach(t => { typeCounts[t] = 0; typeCaps[t] = 0; });

  // 全施設に lat/lng が事前埋め込みされていればローディング画面を即座に消す
  const allHaveLatLng = FACILITIES.every(f => f.lat && f.lng);
  if (allHaveLatLng) {
    document.getElementById('loading').style.display = 'none';
  } else {
    document.getElementById('progress-text').textContent = `0 / ${total} 件処理中...`;
  }

  for (let i = 0; i < FACILITIES.length; i++) {
    const f = FACILITIES[i];
    let ll = f.lat && f.lng ? { lat: f.lat, lng: f.lng } : cache[f.a] || null;
    if (!ll) {
      ll = await geocodeAddress(f.a);
      if (ll) cache[f.a] = ll;
      await new Promise(r => setTimeout(r, 80));
    }

    if (!allHaveLatLng) {
      const pct = Math.round((i + 1) / total * 100);
      document.getElementById('progress-bar').style.width = pct + '%';
      document.getElementById('progress-text').textContent = `${i + 1} / ${total} 件処理中...`;
    }

    if (!ll) continue;

    const j = jitter(ll.lat, ll.lng);
    const color = TYPE_COLOR[f.t] || '#888';
    const marker = L.circleMarker([j.lat, j.lng], {
      radius: capRadius(f.c), color: '#fff', weight: 1.5,
      fillColor: color, fillOpacity: 0.88
    }).bindPopup(popupHTML(f), { maxWidth: 240 });

    markerList.push({ marker, facility: f });
    marker.addTo(pinLayer);

    heatData.push([ll.lat, ll.lng, f.c / MAX_CAP]);
    totalCap += f.c;
    typeCounts[f.t] = (typeCounts[f.t] || 0) + 1;
    typeCaps[f.t]   = (typeCaps[f.t]   || 0) + f.c;
  }

  localStorage.setItem(CACHE_KEY, JSON.stringify(cache));
  heatLayer = L.heatLayer(heatData, { radius: 25, blur: 18, maxZoom: 16 });
  document.getElementById('loading').style.display = 'none';

  // Stats panel
  const rows = TYPE_ORDER.map(t => `
    <div class="st-row">
      <div class="st-dot" style="background:${TYPE_COLOR[t]};"></div>
      <span class="st-name">${t}</span>
      <span class="st-n">${typeCounts[t]}園</span>
      <span class="st-cap">定員 ${(typeCaps[t]||0).toLocaleString()}</span>
    </div>
  `).join('');
  document.getElementById('stats-rows').innerHTML = rows;
  document.getElementById('stats-total-num').textContent = totalCap.toLocaleString();

  // update count badge
  document.getElementById('count-num').textContent = markerList.length;
}

// ── Filter pills ──
document.querySelectorAll('.filter-pill').forEach(pill => {
  const origBg = pill.style.background;
  const origBorder = pill.style.borderColor;
  pill.dataset.origBg = origBg;
  pill.dataset.origBorder = origBorder;

  pill.addEventListener('click', () => {
    const t = pill.dataset.type;
    if (activeTypes.has(t)) {
      activeTypes.delete(t);
      pill.classList.add('off');
      pill.classList.remove('on');
    } else {
      activeTypes.add(t);
      pill.classList.remove('off');
      pill.classList.add('on');
      pill.style.background = pill.dataset.origBg;
      pill.style.borderColor = pill.dataset.origBorder;
    }
    applyFilters();
  });
});

// ── Search ──
const searchInput = document.getElementById('search-input');
const searchClear = document.getElementById('search-clear');
searchInput.addEventListener('input', () => {
  searchQuery = searchInput.value.trim();
  searchClear.style.display = searchQuery ? 'block' : 'none';
  applyFilters();
});
searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchQuery = '';
  searchClear.style.display = 'none';
  applyFilters();
});

// ── Toggle switches ──
function toggleLayer(type) {
  if (type === 'pins') {
    pinsVisible = !pinsVisible;
    document.getElementById('sw-pins').classList.toggle('on', pinsVisible);
    if (pinsVisible) pinLayer.addTo(map); else map.removeLayer(pinLayer);
  } else {
    heatVisible = !heatVisible;
    document.getElementById('sw-heat').classList.toggle('on', heatVisible);
    if (heatLayer) {
      if (heatVisible) heatLayer.addTo(map); else map.removeLayer(heatLayer);
    }
  }
}
document.getElementById('row-pins').addEventListener('click', () => toggleLayer('pins'));
document.getElementById('row-heat').addEventListener('click', () => toggleLayer('heat'));

init();
</script>
